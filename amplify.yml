# AWS Amplify Hosting build spec for FECINE ACADEMY (learn.fecine.ai).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci --no-audit --no-fund
    build:
      commands:
        - npm run build
        - npm run check
  artifacts:
    baseDirectory: docs/.vitepress/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
